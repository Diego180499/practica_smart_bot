<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBot Admin — Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="login-page">
    <div class="login-brand">
      <div class="login-brand__icon">🤖</div>
      <h1>SmartBot <span style="color: var(--color-accent)">Admin</span></h1>
      <p>Panel de administración del bot de Telegram</p>
    </div>

    <div class="login-card">
      <h2>Iniciar Sesión</h2>
      <div id="login-error" class="login-error hidden"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" class="form-control"
                 placeholder="Ingresa tu usuario" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-group">
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Ingresa tu contraseña" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn--primary" id="btn-login">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <div id="loader" class="loader hidden">
    <div class="loader__spinner"></div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
